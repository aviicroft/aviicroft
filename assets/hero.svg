<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
      <title id="title">Avinash K — Cybersecurity Command Center</title>
      <desc id="desc">Animated cybersecurity themed visualization for Avinash K</desc>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#03060b"/>
          <stop offset="55%" stop-color="#07111d"/>
          <stop offset="100%" stop-color="#020305"/>
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#4df7ff"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff244f"/>
          <stop offset="100%" stop-color="#ff5c7a"/>
        </linearGradient>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#153043" stroke-width="0.7" opacity=".55"/>
          <circle cx="0" cy="0" r="1" fill="#00e5ff" opacity=".35"/>
        </pattern>
      </defs>
      <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="url(#grid)" opacity=".9"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#1b4054" stroke-width="1"/>

  <g opacity=".45">
    <path d="M60 320H1140" stroke="#00e5ff" stroke-width="1"/>
    <path d="M60 340H1140" stroke="#ff244f" stroke-width="1" opacity=".35"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-width="1.5" opacity=".65">
    <path d="M80 80H230L270 120H390" />
    <path d="M820 90H940L980 130H1120" />
    <path d="M120 250H250L285 215H420" />
    <path d="M780 250H920L955 215H1090" />
  </g>
  <g fill="#00e5ff" filter="url(#glowCyan)">
    <circle cx="230" cy="80" r="3"/><circle cx="390" cy="120" r="3"/>
    <circle cx="940" cy="90" r="3"/><circle cx="1120" cy="130" r="3"/>
    <circle cx="250" cy="250" r="3"/><circle cx="420" cy="215" r="3"/>
  </g>
  <g opacity=".55">
    <circle cx="170" cy="165" r="2" fill="#4df7ff"><animate attributeName="cy" values="165;140;165" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="290" r="2" fill="#ff244f"><animate attributeName="cy" values="290;315;290" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="80" r="2" fill="#00e5ff"><animate attributeName="cx" values="690;735;690" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="monospace" text-anchor="middle">
    <text x="600" y="132" fill="#00e5ff" font-size="14" letter-spacing="6">CYBER FORENSICS COMMAND CENTER</text>
    <text x="600" y="195" fill="#f5fbff" font-size="54" font-weight="700" letter-spacing="3">AVINASH K</text>
    <text x="600" y="226" fill="#8ca8b8" font-size="13" letter-spacing="4">CYBERSECURITY • DIGITAL FORENSICS • BLOCKCHAIN INTELLIGENCE</text>
    <text x="600" y="252" fill="#8ca8b8" font-size="13" letter-spacing="4">AI × FULL-STACK × CLOUD INFRASTRUCTURE</text>
  </g>
  <g font-family="monospace" font-size="12">
    <text x="55" y="375" fill="#59ff9a">● SYSTEM</text>
    <text x="135" y="375" fill="#59ff9a">READY</text>
    <text x="935" y="375" fill="#00e5ff">TRACE ENGINE:</text>
    <text x="1045" y="375" fill="#ff5c7a">ONLINE</text>
  </g>
  <g>
    <rect x="55" y="55" width="4" height="310" rx="2" fill="#00e5ff" opacity=".7">
      <animate attributeName="y" values="55;345;55" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.8;.15" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="monospace" font-size="10" fill="#5b7787" opacity=".8">
    <text x="80" y="112">INIT://FORENSIC_CORE</text>
    <text x="945" y="165">NODE://TRACE_07</text>
    <text x="80" y="305">SIGNAL://ANALYSIS</text>
    <text x="945" y="325">SEC://MONITOR</text>
  </g>
  <g>
    <text x="600" y="300" fill="#00e5ff" font-family="monospace" font-size="12" text-anchor="middle">
      <tspan>› INITIALIZING FORENSIC ENGINE...</tspan>
      <animate attributeName="opacity" values="1;.45;1" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

    </svg>
