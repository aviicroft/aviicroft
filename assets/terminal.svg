<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
      <title id="title">Avinash K Terminal</title>
      <desc id="desc">Animated cybersecurity themed visualization for Avinash K</desc>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#03060b"/>
          <stop offset="55%" stop-color="#07111d"/>
          <stop offset="100%" stop-color="#020305"/>
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#4df7ff"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff244f"/>
          <stop offset="100%" stop-color="#ff5c7a"/>
        </linearGradient>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#153043" stroke-width="0.7" opacity=".55"/>
          <circle cx="0" cy="0" r="1" fill="#00e5ff" opacity=".35"/>
        </pattern>
      </defs>
      <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="url(#grid)" opacity=".9"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#1b4054" stroke-width="1"/>

  <g font-family="monospace">
    <text x="55" y="55" fill="#00e5ff" font-size="14" letter-spacing="3">AI INTELLIGENCE TERMINAL</text>
    <rect x="55" y="80" width="1090" height="285" rx="12" fill="#02070b" stroke="#1c485e"/>
    <circle cx="80" cy="103" r="5" fill="#ff244f"/><circle cx="98" cy="103" r="5" fill="#ffd166"/><circle cx="116" cy="103" r="5" fill="#59ff9a"/>
    <g font-size="14">
      <text x="80" y="145" fill="#59ff9a">$ whoami</text><text x="210" y="145" fill="#d8edf5">avii</text>
      <text x="80" y="180" fill="#59ff9a">$ domain</text><text x="210" y="180" fill="#d8edf5">cybersecurity + digital forensics</text>
      <text x="80" y="215" fill="#59ff9a">$ build</text><text x="210" y="215" fill="#d8edf5">AI + full-stack systems</text>
      <text x="80" y="250" fill="#59ff9a">$ investigate</text><text x="210" y="250" fill="#d8edf5">blockchain transactions</text>
      <text x="80" y="285" fill="#59ff9a">$ deploy</text><text x="210" y="285" fill="#d8edf5">cloud infrastructure</text>
      <text x="80" y="320" fill="#59ff9a">$ status</text><text x="210" y="320" fill="#00e5ff">ONLINE</text>
      <rect x="275" y="307" width="8" height="17" fill="#00e5ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

    </svg>
