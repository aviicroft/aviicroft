<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
      <title id="title">Cybersecurity Operations Network</title>
      <desc id="desc">Animated cybersecurity themed visualization for Avinash K</desc>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#03060b"/>
          <stop offset="55%" stop-color="#07111d"/>
          <stop offset="100%" stop-color="#020305"/>
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#4df7ff"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff244f"/>
          <stop offset="100%" stop-color="#ff5c7a"/>
        </linearGradient>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#153043" stroke-width="0.7" opacity=".55"/>
          <circle cx="0" cy="0" r="1" fill="#00e5ff" opacity=".35"/>
        </pattern>
      </defs>
      <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="url(#grid)" opacity=".9"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#1b4054" stroke-width="1"/>

  <g font-family="monospace">
    <text x="60" y="55" fill="#00e5ff" font-size="14" letter-spacing="3">CYBERSECURITY // OPERATIONS</text>
    <text x="60" y="78" fill="#5d7787" font-size="11">NETWORK TELEMETRY / SECURITY MONITORING / FORENSIC SIGNALS</text>
  </g>
  <g stroke="#163c50" stroke-width="1.5" fill="none">
    <path d="M180 190L360 130L540 205L740 120L920 195L1050 135"/>
    <path d="M180 190L330 290L540 205L760 295L920 195"/>
    <path d="M360 130L330 290M740 120L760 295M920 195L1050 300"/>
  </g>
  <g fill="#00e5ff" filter="url(#glowCyan)">
    <circle cx="180" cy="190" r="6"><animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="130" r="5"><animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="205" r="7"><animate attributeName="r" values="5;10;5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="120" r="5"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="195" r="6"><animate attributeName="r" values="5;9;5" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ff244f" filter="url(#glowRed)">
    <circle cx="330" cy="290" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="295" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="300" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M180 190L360 130"><animate attributeName="stroke-dasharray" values="0 220;80 140;220 0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M540 205L740 120"><animate attributeName="stroke-dasharray" values="0 220;90 130;220 0" dur="3.5s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="monospace" font-size="11">
    <text x="150" y="215" fill="#7f9aaa">NODE_01</text><text x="315" y="315" fill="#ff5c7a">ALERT</text>
    <text x="505" y="230" fill="#7f9aaa">CORE</text><text x="730" y="320" fill="#ff5c7a">SCAN</text>
    <text x="900" y="220" fill="#7f9aaa">GATEWAY</text>
  </g>
  <g font-family="monospace" font-size="11" fill="#59ff9a">
    <text x="60" y="360">RADAR: ACTIVE</text><text x="220" y="360">PACKETS: STREAMING</text>
    <text x="450" y="360">THREATS: MONITORED</text><text x="680" y="360">FORENSICS: READY</text>
  </g>

    </svg>
