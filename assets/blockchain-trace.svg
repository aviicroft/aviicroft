<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
      <title id="title">Blockchain Forensics Trace Engine</title>
      <desc id="desc">Animated cybersecurity themed visualization for Avinash K</desc>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#03060b"/>
          <stop offset="55%" stop-color="#07111d"/>
          <stop offset="100%" stop-color="#020305"/>
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#4df7ff"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff244f"/>
          <stop offset="100%" stop-color="#ff5c7a"/>
        </linearGradient>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#153043" stroke-width="0.7" opacity=".55"/>
          <circle cx="0" cy="0" r="1" fill="#00e5ff" opacity=".35"/>
        </pattern>
      </defs>
      <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="url(#grid)" opacity=".9"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#1b4054" stroke-width="1"/>

  <g font-family="monospace">
    <text x="60" y="55" fill="#00e5ff" font-size="14" letter-spacing="3">BLOCKCHAIN FORENSICS // TRACE ENGINE</text>
    <text x="60" y="78" fill="#5d7787" font-size="11">TRANSACTION GRAPH / MULTI-HOP PATH / VASP ATTRIBUTION</text>
  </g>
  <g stroke="#254457" stroke-width="2" fill="none">
    <path d="M180 205L380 130L585 205L790 125L1000 205"/>
    <path d="M380 130L585 300L790 125"/>
    <path d="M585 300L790 315L1000 205"/>
  </g>
  <g stroke="#00e5ff" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M180 205L380 130L585 205"><animate attributeName="stroke-dasharray" values="0 700;200 500;700 0" dur="4s" repeatCount="indefinite"/></path>
  </g>
  <g stroke="#ff244f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M585 205L790 125L1000 205"><animate attributeName="stroke-dasharray" values="0 600;180 420;600 0" dur="4.5s" repeatCount="indefinite"/></path>
  </g>
  <g stroke="#00e5ff" stroke-width="3" fill="none">
    <path d="M380 130L585 300L790 315"><animate attributeName="stroke-dasharray" values="0 520;170 350;520 0" dur="5s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#06121b" stroke="#00e5ff" stroke-width="2">
    <circle cx="180" cy="205" r="26"/><circle cx="380" cy="130" r="26"/><circle cx="585" cy="205" r="29"/><circle cx="790" cy="125" r="26"/><circle cx="1000" cy="205" r="30"/>
    <circle cx="585" cy="300" r="24"/><circle cx="790" cy="315" r="24"/>
  </g>
  <g font-family="monospace" text-anchor="middle" font-size="10">
    <text x="180" y="209" fill="#8aa6b6">WALLET A</text>
    <text x="380" y="134" fill="#8aa6b6">WALLET B</text>
    <text x="585" y="209" fill="#00e5ff">TRACE</text>
    <text x="790" y="129" fill="#ff5c7a">RISK</text>
    <text x="1000" y="209" fill="#59ff9a">VASP</text>
    <text x="585" y="304" fill="#8aa6b6">WALLET C</text>
    <text x="790" y="319" fill="#8aa6b6">WALLET D</text>
  </g>
  <g font-family="monospace" font-size="11">
    <text x="60" y="365" fill="#00e5ff">BLUE: NORMAL</text>
    <text x="220" y="365" fill="#ff5c7a">RED: SUSPICIOUS</text>
    <text x="430" y="365" fill="#00e5ff">CYAN: INVESTIGATED</text>
    <text x="670" y="365" fill="#59ff9a">GREEN: IDENTIFIED</text>
  </g>

    </svg>
