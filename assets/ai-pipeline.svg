<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
      <title id="title">AI Intelligence Pipeline</title>
      <desc id="desc">Animated cybersecurity themed visualization for Avinash K</desc>
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#03060b"/>
          <stop offset="55%" stop-color="#07111d"/>
          <stop offset="100%" stop-color="#020305"/>
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#4df7ff"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff244f"/>
          <stop offset="100%" stop-color="#ff5c7a"/>
        </linearGradient>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0V40" fill="none" stroke="#153043" stroke-width="0.7" opacity=".55"/>
          <circle cx="0" cy="0" r="1" fill="#00e5ff" opacity=".35"/>
        </pattern>
      </defs>
      <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="url(#grid)" opacity=".9"/>
      <rect x="12" y="12" width="1176" height="396" rx="16" fill="none" stroke="#1b4054" stroke-width="1"/>

  <g font-family="monospace">
    <text x="60" y="55" fill="#00e5ff" font-size="14" letter-spacing="3">AI // INTELLIGENCE LAB</text>
    <text x="60" y="78" fill="#5d7787" font-size="11">QUERY → INTENT → EMBEDDING → RETRIEVAL → LLM → REASONING → RESPONSE</text>
  </g>
  <g stroke="#1a4155" stroke-width="2" fill="none">
    <path d="M130 205H285M350 205H505M570 205H725M790 205H945M1010 205H1080"/>
  </g>
  <g stroke="#00e5ff" stroke-width="4" stroke-linecap="round">
    <path d="M130 205H285"><animate attributeName="stroke-dasharray" values="0 155;70 85;155 0" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M350 205H505"><animate attributeName="stroke-dasharray" values="0 155;70 85;155 0" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M570 205H725"><animate attributeName="stroke-dasharray" values="0 155;70 85;155 0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M790 205H945"><animate attributeName="stroke-dasharray" values="0 155;70 85;155 0" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M1010 205H1080"><animate attributeName="stroke-dasharray" values="0 70;35 35;70 0" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#06121b" stroke="#00e5ff" stroke-width="2">
    <rect x="70" y="165" width="110" height="80" rx="10"/><rect x="285" y="165" width="100" height="80" rx="10"/>
    <rect x="505" y="165" width="100" height="80" rx="10"/><rect x="725" y="165" width="100" height="80" rx="10"/>
    <rect x="945" y="165" width="100" height="80" rx="10"/>
  </g>
  <g font-family="monospace" text-anchor="middle" font-size="11">
    <text x="125" y="201" fill="#00e5ff">USER QUERY</text><text x="125" y="220" fill="#718b9a">INPUT</text>
    <text x="335" y="201" fill="#00e5ff">INTENT</text><text x="335" y="220" fill="#718b9a">CLASSIFY</text>
    <text x="555" y="201" fill="#00e5ff">EMBED</text><text x="555" y="220" fill="#718b9a">VECTOR</text>
    <text x="775" y="201" fill="#00e5ff">RETRIEVE</text><text x="775" y="220" fill="#718b9a">RAG</text>
    <text x="995" y="201" fill="#00e5ff">LLM</text><text x="995" y="220" fill="#718b9a">REASON</text>
  </g>
  <g font-family="monospace" fill="#59ff9a" font-size="11">
    <text x="70" y="325">GENAI</text><text x="170" y="325">PROMPT ENGINEERING</text><text x="370" y="325">RAG</text>
    <text x="445" y="325">EMBEDDINGS</text><text x="585" y="325">SENTENCE TRANSFORMERS</text>
    <text x="810" y="325">MODEL TRAINING</text><text x="960" y="325">LLM INTEGRATION</text>
  </g>

    </svg>
